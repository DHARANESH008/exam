services:
  - type: web
    name: smartexam-backend
    env: java
    rootDir: smartexam-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/smartexam-backend-1.0.0.jar --spring.profiles.active=prod
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: smartexam-db
          property: connectionString

databases:
  - name: smartexam-db
    databaseName: smartexam_db
    user: smartexam_user
