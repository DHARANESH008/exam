services:
  - type: web
    name: smartexam-backend
    env: java
    rootDir: smartexam-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/smartexam-backend-1.0.0.jar --spring.profiles.active=prod
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
