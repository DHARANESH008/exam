server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: smartexam-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:smartexam_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${JDBC_DRIVER:org.h2.Driver}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

smartexam:
  jwt:
    secret: 9a6e2361b1b4f4c82c875d9e5f7a01a3b8c6e2a1b9d4f8c7a6e5b4c3d2e1f0a9
    expiration-ms: 86400000 # 24 hours
