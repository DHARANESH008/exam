server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: smartexam-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/smartexam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: ${JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${JDBC_DATABASE_USERNAME:root}
    password: ${JDBC_DATABASE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

smartexam:
  jwt:
    secret: 9a6e2361b1b4f4c82c875d9e5f7a01a3b8c6e2a1b9d4f8c7a6e5b4c3d2e1f0a9
    expiration-ms: 86400000 # 24 hours
